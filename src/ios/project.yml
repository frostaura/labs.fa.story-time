name: StoryTime
options:
  bundleIdPrefix: com.frostaura
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    STORYTIME_WEB_APP_URL: "http://localhost:5173"
    STORYTIME_API_BASE_URL: ""
    # Device builds: pass DEVELOPMENT_TEAM (see scripts/ios-device.sh); automatic signing does the rest.
    CODE_SIGN_STYLE: Automatic
packages:
  StoryTimeKit:
    path: StoryTimeKit
targets:
  StoryTime:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: StoryTime
    dependencies:
      - package: StoryTimeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frostaura.storytime
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: StoryTime/Resources/Info.plist
schemes:
  StoryTime:
    build:
      targets:
        StoryTime: all
