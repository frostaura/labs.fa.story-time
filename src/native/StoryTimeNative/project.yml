# XcodeGen spec for StoryTime's native-features framework. Generated .xcodeproj is not
# committed; src/native/build.sh regenerates it and builds the xcframework.
# One folder per feature under Sources/ (FoundationModels/ today; Narration/ and Imagery/
# join later). Public surface: @objc, completion-handler based, JSON in / JSON out.
name: StoryTimeNative
options:
  bundleIdPrefix: net.frostaura.storytime
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
targets:
  StoryTimeNative:
    type: framework
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.frostaura.storytime.native
        PRODUCT_NAME: StoryTimeNative
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        SKIP_INSTALL: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Shared scheme (otherwise xcodebuild auto-creates one with no supported platforms).
    scheme: {}
